[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/dashboard"
  status = 302
  force = false

[[redirects]]
  from = "/risk-cases/*"
  to = "/risk-cases/:splat"
  status = 200

[[redirects]]
  from = "/investigations/*"
  to = "/investigations/:splat"
  status = 200

[[redirects]]
  from = "/recovery/*"
  to = "/recovery/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
